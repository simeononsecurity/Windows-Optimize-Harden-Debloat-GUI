name: GUI build and regression tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: dotnet build Windows-Optimize-Harden-Debloat.csproj --configuration Release
      - run: dotnet run --project tests/Regression.csproj
      - name: Parse script schema without execution
        shell: powershell
        run: ./tests/SchemaRegression.ps1
